<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypton</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- System Bootloader Screen -->
    <div id="bootScreen">
        <div class="boot-container">
            <div class="boot-logo-ring">
                <div class="boot-spinner"></div>
                <i class="fa-solid fa-microchip boot-icon"></i>
            </div>
            <h1 class="boot-title">CRYPTON v4.5</h1>
            <p class="boot-subtitle" id="bootStatusText">Initialising Nerual Networks</p>
            <div class="boot-progress-bar">
                <div class="boot-progress-fill" id="bootProgressFill"></div>
            </div>
        </div>
    </div>

    <!-- Enhanced Interactive Particle Wallpaper Canvas -->
    <canvas id="wallpaperCanvas"></canvas>

    <!-- Main OS Workspace Area -->
    <div id="workspace"></div>

    <!-- Custom Dynamic Island Top Control Center -->
    <header id="dynamicIsland" class="dynamic-island">
        <div class="island-left">
            <div class="island-logo">
                <i class="fa-solid fa-cube"></i>
                <span class="logo-text">Crypton</span>
            </div>
            <div class="network-status" title="Network Connected">
                <i class="fa-solid fa-wifi"></i>
                <span class="ping-text">12ms</span>
            </div>
        </div>
        <div class="island-center">
            <div class="island-clock" id="islandClock">00:00:00</div>
            <div class="island-date" id="islandDate">Sun, Jul 26</div>
        </div>
        <div class="island-right">
            <div class="system-metrics">
                <span title="CPU Usage"><i class="fa-solid fa-microchip"></i> <span id="cpuUsage">3%</span></span>
                <span title="RAM Usage"><i class="fa-solid fa-memory"></i> <span id="ramUsage">1.6GB</span></span>
            </div>
            <div class="school-badge">
                <span class="school-text">School Name</span>
                <div class="school-logo-placeholder">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Clean Taskbar -->
    <nav id="taskbar">
        <div class="taskbar-group center-group" id="taskbarAppsContainer">
            <div class="taskbar-app" onclick="toggleApp('about')" title="About Crypton">
                <i class="fa-solid fa-circle-info"></i>
                <div class="app-indicator"></div>
            </div>
            <div class="taskbar-app" onclick="toggleApp('domains')" title="Event Domains">
                <i class="fa-solid fa-layer-group"></i>
                <div class="app-indicator"></div>
            </div>
            <div class="taskbar-app" onclick="toggleApp('timeline')" title="Schedule Timeline">
                <i class="fa-solid fa-timeline"></i>
                <div class="app-indicator"></div>
            </div>
            <div class="taskbar-app" onclick="toggleApp('registration')" title="Registration Portal">
                <i class="fa-solid fa-file-pen"></i>
                <div class="app-indicator"></div>
            </div>
            <div class="taskbar-app" onclick="toggleApp('credits')" title="Credits">
                <i class="fa-solid fa-award"></i>
                <div class="app-indicator"></div>
            </div>
        </div>
        <div class="taskbar-group right-group">
            <div class="taskbar-divider"></div>
            <div class="taskbar-tray-icon" onclick="toggleQuickSettings()" title="Quick Settings">
                <i class="fa-solid fa-sliders"></i>
            </div>
            <div class="taskbar-tray-icon" onclick="triggerNotification('Crypton OS', 'System running at peak optimization.')" title="Notifications">
                <i class="fa-solid fa-bell"></i>
                <span class="tray-badge">2</span>
            </div>
        </div>
    </nav>

    <!-- Quick Settings Panel -->
    <div id="quickSettingsPanel" class="quick-settings">
        <div class="qs-header">
            <h4>Quick Control Center</h4>
            <span onclick="toggleQuickSettings()"><i class="fa-solid fa-xmark"></i></span>
        </div>
        <div class="qs-grid">
            <div class="qs-tile active" onclick="this.classList.toggle('active')">
                <i class="fa-solid fa-wifi"></i>
                <span>Optimiser</span>
            </div>
            <div class="qs-tile active" onclick="this.classList.toggle('active')">
                <i class="fa-solid fa-bluetooth"></i>
                <span>Standard</span>
            </div>
            <div class="qs-tile active" id="wallTile" onclick="toggleWallpaperMode()">
                <i class="fa-solid fa-palette"></i>
                <span>Mode</span>
            </div>
            <div class="qs-tile" onclick="triggerFullScreenMode()">
                <i class="fa-solid fa-expand"></i>
                <span>Fullscreen</span>
            </div>
            <div class="qs-tile" onclick="clearAllWindows()">
                <i class="fa-solid fa-broom"></i>
                <span>Clear</span>
            </div>
            <div class="qs-tile" onclick="location.reload()">
                <i class="fa-solid fa-power-off"></i>
                <span>Reboot</span>
            </div>
        </div>
        <div class="qs-slider-group">
            <div class="qs-slider-label"><span><i class="fa-solid fa-volume-high"></i> Master Volume</span><span id="volVal">80%</span></div>
            <input type="range" min="0" max="100" value="80" oninput="document.getElementById('volVal').textContent = this.value + '%'">
        </div>
        <div class="qs-slider-group">
            <div class="qs-slider-label"><span><i class="fa-solid fa-sun"></i> Display Brightness</span><span id="briVal">100%</span></div>
            <input type="range" min="30" max="100" value="100" oninput="updateBrightness(this.value)">
        </div>
    </div>

    <!-- Context Menu -->
    <div id="desktopContextMenu" class="context-menu">
        <div class="menu-item" onclick="toggleWallpaperMode()"><i class="fa-solid fa-palette"></i> Toggle Live Wallpaper</div>
        <div class="menu-item" onclick="clearAllWindows()"><i class="fa-solid fa-window-minimize"></i> Clear Windows</div>
        <div class="menu-divider"></div>
        <div class="menu-item" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i> System Reboot</div>
    </div>

    <!-- Notification Toast Container -->
    <div id="notificationContainer" class="notification-container"></div>

    <!-- Display Brightness Overlay Layer -->
    <div id="displayDimmer" class="display-dimmer"></div>

    <!-- Custom Advanced Interactive Cursor System -->
    <div id="customCursorDot" class="custom-cursor-dot"></div>
    <div id="customCursorRing" class="custom-cursor-ring"></div>

    <script src="script.js"></script>
</body>
</html>
