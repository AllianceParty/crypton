<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypton</title>
    <link rel="icon" type="image/png" sizes="32x32" href="Crypton.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- System Bootloader Screen -->
    <div id="bootScreen">
        <div class="boot-container">
            <div class="boot-logo-ring">
                <div class="boot-spinner"></div>
                <i class="fa-solid fa-microchip boot-icon"></i>
            </div>
            <h1 class="boot-title">CRYPTON v4.5</h1>
            <p class="boot-subtitle" id="bootStatusText">Initialising Neural Networks</p>
            <div class="boot-progress-bar">
                <div class="boot-progress-fill" id="bootProgressFill"></div>
            </div>
        </div>
    </div>

    <!-- Enhanced Interactive Particle Wallpaper Canvas -->
    <canvas id="wallpaperCanvas"></canvas>

    <!-- Main OS Workspace Area -->
    <div id="workspace"></div>

    <!-- Custom Dynamic Island Top Control Center -->
    <header id="dynamicIsland" class="dynamic-island">
        <div class="island-left">
            <div class="island-logo">
                <i class="fa-solid fa-cube"></i>
                <span class="logo-text">Crypton</span>
            </div>
        </div>
        <div class="island-center">
            <div class="island-clock" id="islandClock">00:00:00</div>
            <div class="island-date" id="islandDate">Sun, Jul 26</div>
        </div>
        <div class="island-right">
            <div class="school-badge">
                <span class="school-text">School Name</span>
                <div class="school-logo-placeholder">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Clean Taskbar -->
    <nav id="taskbar">
        <div class="taskbar-group center-group" id="taskbarAppsContainer">
            <div class="taskbar-app" onclick="toggleApp('about')" title="About Crypton">
                <i class="fa-solid fa-circle-info"></i>
                <div class="app-indicator"></div>
            </div>
            <div class="taskbar-app" onclick="toggleApp('domains')" title="Event Domains">
                <i class="fa-solid fa-layer-group"></i>
                <div class="app-indicator"></div>
            </div>
            <div class="taskbar-app" onclick="toggleApp('timeline')" title="Schedule Timeline">
                <i class="fa-solid fa-timeline"></i>
                <div class="app-indicator"></div>
            </div>
            <div class="taskbar-app" onclick="toggleApp('registration')" title="Registration Portal">
                <i class="fa-solid fa-file-pen"></i>
                <div class="app-indicator"></div>
            </div>
            <div class="taskbar-app" onclick="toggleApp('brochure')" title="Event Brochure">
                <i class="fa-solid fa-book-open"></i>
                <div class="app-indicator"></div>
            </div>
            <div class="taskbar-app" onclick="toggleApp('trailer')" title="Event Trailer">
                <i class="fa-solid fa-film"></i>
                <div class="app-indicator"></div>
            </div>
            <div class="taskbar-app" onclick="toggleApp('credits')" title="Credits">
                <i class="fa-solid fa-award"></i>
                <div class="app-indicator"></div>
            </div>
        </div>
    </nav>

    <!-- Context Menu -->
    <div id="desktopContextMenu" class="context-menu">
        <div class="menu-item" onclick="toggleWallpaperMode()"><i class="fa-solid fa-palette"></i> Toggle Live Wallpaper</div>
        <div class="menu-item" onclick="clearAllWindows()"><i class="fa-solid fa-window-minimize"></i> Clear Windows</div>
        <div class="menu-divider"></div>
        <div class="menu-item" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i> System Reboot</div>
    </div>

    <!-- Notification Toast Container -->
    <div id="notificationContainer" class="notification-container"></div>

    <!-- Display Brightness Overlay Layer -->
    <div id="displayDimmer" class="display-dimmer"></div>

    <!-- Custom Advanced Interactive Cursor System -->
    <div id="customCursorDot" class="custom-cursor-dot"></div>
    <div id="customCursorRing" class="custom-cursor-ring"></div>

    <script src="script.js"></script>
</body>
</html>
